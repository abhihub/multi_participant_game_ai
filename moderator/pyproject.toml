[project]
name = "game-moderator"
version = "0.1.0"
description = "LiveKit Agents AI moderator for multiplayer game sessions"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
    "pytest-timeout>=2.3,<3",
    "livekit-api>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moderator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Layer 1 — no network, no API keys",
    "behavioral: Layer 2 — requires OPENAI_API_KEY",
    "e2e: Layer 3 — requires LiveKit Cloud + Game Engine running",
]
